# /etc/chrony/conf.d/tradebot.conf: Indian time sources first (NPL is India's national time keeper).
server time.nplindia.org iburst
pool in.pool.ntp.org iburst maxsources 3
pool ntp.ubuntu.com iburst maxsources 2
# Step only right after boot; slew afterwards so engine timers never jump
makestep 1.0 3
